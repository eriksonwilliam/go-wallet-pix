name: Imagem

# Em pull request: build, SBOM e varredura de vulnerabilidades, sem publicar.
# Em tag v*: o mesmo, e publica no GHCR com a tag da versao (imutavel) e o SHA.
# Nada e publicado sem alguem criar a tag.
on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/go-wallet-pix
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0.17.8
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Trivy (vulnerabilidades da imagem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Guardar SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Login no GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:$version"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:$version"
